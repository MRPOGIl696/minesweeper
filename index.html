<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nervous Minesweeper</title>

  <style>
    /* ---------- Colors ---------- */
    :root {
      color-scheme: dark;
      --bg: #0d0f14;
      --text: #e8eaf0;
      --cell: #1f2430;
      --cell-open: #12151c;
      --red: #ff2d3d;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    /* ---------- Page ---------- */
    body {
      margin: 0;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      transition: background 0.3s;
    }

    /* Background changes with the tension level */
    body.tense { background: #160b0e; }
    body.panic { animation: pulse 0.38s infinite; }

    @keyframes pulse {
      0%, 100% { background: #2a0508; }
      50%      { background: #6b0a12; }
    }

    h1 {
      font-size: 20px;
      margin: 4px 0 10px;
    }

    /* ---------- Timer bar and idle bar ---------- */
    .bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .idle {
      width: 100%;
      max-width: 400px;
      height: 8px;
      margin-bottom: 10px;
      background: var(--cell);
      border-radius: 4px;
      overflow: hidden;
    }

    #fill {
      height: 100%;
      width: 0;
      background: #4ade80;
    }

    /* ---------- Grid and tiles ---------- */
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);  /* change together with GRID_SIZE in the script */
      gap: 3px;
      width: 100%;
      max-width: 400px;
    }

    .tile {
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: var(--cell);
      color: var(--text);
      font-size: clamp(14px, 4.5vw, 20px);
      font-weight: 800;
    }

    .tile.open { background: var(--cell-open); }
    .tile.bomb { background: var(--red); }

    /* Number colors */
    .n1 { color: #60a5fa; }
    .n2 { color: #4ade80; }
    .n3 { color: #f87171; }
    .n4 { color: #c084fc; }
    .n5, .n6, .n7, .n8 { color: #fbbf24; }

    /* ---------- Flag button ---------- */
    .tools {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      padding: 10px 14px;
      border: 1px solid #333a4a;
      border-radius: 8px;
      background: var(--cell);
      color: var(--text);
      font-size: 15px;
    }

    .tool-btn.on { background: #3b82f6; }

    /* ---------- Start / Game over screen ---------- */
    #overlay {
      position: fixed;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      background: rgba(0, 0, 0, 0.88);
    }

    #overlay h2 {
      margin: 0;
      font-size: 38px;
    }

    #overlay p {
      max-width: 320px;
      margin: 0;
      line-height: 1.4;
      opacity: 0.85;
    }

    #nameInput {
      width: 240px;
      padding: 12px 14px;
      border: 1px solid #333a4a;
      border-radius: 10px;
      background: var(--cell);
      color: var(--text);
      font-size: 18px;
      text-align: center;
    }

    #nameInput.error { border-color: var(--red); }

    #players {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #333a4a;
      border-radius: 8px;
      font-size: 14px;
    }

    #players h3 { margin: 0 0 6px; font-size: 14px; opacity: 0.8; }
    #players div { padding: 2px 0; }

    #overlay button {
      padding: 14px 30px;
      border: 0;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <h1>💣 Nervous Minesweeper</h1>

  <div class="bar">
    <span id="timeLeft">⏱ 60</span>
    <span id="bombCount">💣 10</span>
  </div>
  <div class="idle"><div id="fill"></div></div>

  <div id="grid"></div>

  <div class="tools">
    <button class="tool-btn" id="flagBtn">🚩 Flag mode: off</button>
  </div>

  <div id="players"><h3>👥 Players right now</h3><div id="playerList"></div></div>

  <div id="overlay">
    <h2 id="overlayTitle">Nervous Minesweeper</h2>
    <p id="overlayText">
      You have 60 seconds total. Pick a tile within 10 seconds of each move,
      or the dread gets worse. Turn sound on!
    </p>
    <input id="nameInput" maxlength="16" placeholder="Enter your username" autocomplete="off">
    <button id="startBtn">Start</button>
  </div>

  <script>
    /* =====================================================
       SETTINGS: change these to tweak the game
       ===================================================== */
    const GRID_SIZE  = 5;    // 5 means a 5x5 board
    const BOMB_COUNT = 4;
    const TOTAL_TIME = 30;   // seconds for the whole game
    const IDLE_LIMIT = 20;   // seconds you can wait before the panic sound starts

    /* =====================================================
       STATE
       ===================================================== */
    let tiles = [];          // one object per tile: { bomb, revealed, flagged, count, el }
    let gameRunning = false;
    let gameOver    = false;
    let firstClick  = true;
    let flagMode    = false;
    let startTime   = 0;
    let lastClick   = 0;
    let gameLoop    = null;  // the interval that updates the timers
    let playerName  = '';    // the username typed on the start screen
    let room        = null;  // live "who is here" connection (only exists when published)

    const $ = (id) => document.getElementById(id);

    /* =====================================================
       SOUND
       Everything is generated by the browser (Web Audio API),
       so no audio files are needed.
       ===================================================== */
    let audio = null;        // the audio context
    let tension = 0;         // 0 = calm, 1 = tense, 2 = panic
    let heartbeatTimer = null;
    let stingTimer = null;
    let dronePieces = [];    // oscillators to stop later
    let sirenPieces = [];

    // Play one short beep that fades out
    function playTone(freq, duration, type, volume, endFreq) {
      const now  = audio.currentTime;
      const osc  = audio.createOscillator();
      const gain = audio.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);

      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain).connect(audio.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Create an oscillator that keeps playing until stopped
    function startOscillator(freq, type, volume, lowpassFreq) {
      const osc    = audio.createOscillator();
      const gain   = audio.createGain();
      const filter = audio.createBiquadFilter();

      osc.type = type;
      osc.frequency.value = freq;
      filter.type = 'lowpass';
      filter.frequency.value = lowpassFreq;
      gain.gain.value = volume;

      osc.connect(filter).connect(gain).connect(audio.destination);
      osc.start();
      return osc;
    }

    // Explosion: a burst of fading noise plus a low drop
    function playExplosion() {
      const length = audio.sampleRate * 1.6;
      const buffer = audio.createBuffer(1, length, audio.sampleRate);
      const data   = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
      }

      const source = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      const gain   = audio.createGain();

      source.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, audio.currentTime);
      filter.frequency.exponentialRampToValueAtTime(80, audio.currentTime + 1.5);
      gain.gain.value = 1.2;

      source.connect(filter).connect(gain).connect(audio.destination);
      source.start();

      playTone(120, 1.2, 'sine', 1, 25);
    }

    // Two thumps, repeated. Faster during panic.
    function heartbeat() {
      if (tension === 0) return;

      playTone(62, 0.2, 'sine', 1.2, 36);
      setTimeout(() => playTone(58, 0.16, 'sine', 0.6, 36), tension === 2 ? 130 : 190);

      heartbeatTimer = setTimeout(heartbeat, tension === 2 ? 360 : 850);
    }

    function stopAllSounds() {
      [...dronePieces, ...sirenPieces].forEach((osc) => {
        try { osc.stop(); } catch (e) { /* already stopped */ }
      });
      dronePieces = [];
      sirenPieces = [];
      clearTimeout(heartbeatTimer);
      clearInterval(stingTimer);
    }

    // Switch between calm (0), tense (1) and panic (2)
    function setTension(level) {
      if (!audio || level === tension) return;

      stopAllSounds();
      tension = level;
      document.body.className = level === 1 ? 'tense' : level === 2 ? 'panic' : '';
      if (level === 0) return;

      // Low creepy drone (used in both tense and panic)
      const wobbler = startOscillator(level === 2 ? 82.4 : 77.8, 'triangle', 0.05, 400);
      dronePieces = [
        startOscillator(55,   'sawtooth', 0.07, 220),
        startOscillator(58.3, 'sawtooth', 0.07, 220),
        wobbler,
      ];

      if (level === 1) {
        // Tense: the drone wobbles slowly and a thin high note pings now and then
        const lfo     = audio.createOscillator();
        const lfoGain = audio.createGain();
        lfo.frequency.value = 5;
        lfoGain.gain.value = 40;
        lfo.connect(lfoGain).connect(wobbler.detune);
        lfo.start();
        dronePieces.push(lfo);

        stingTimer = setInterval(() => {
          playTone(1180 + Math.random() * 60, 1.4, 'sine', 0.05, 1100);
        }, 2600);
      } else {
        // Panic: a siren plus a screech that keeps rising in pitch
        const siren     = audio.createOscillator();
        const sirenGain = audio.createGain();
        const lfo       = audio.createOscillator();
        const lfoGain   = audio.createGain();

        siren.type = 'square';
        siren.frequency.value = 620;
        lfo.frequency.value = 2.5;
        lfoGain.gain.value = 260;
        lfo.connect(lfoGain).connect(siren.frequency);
        sirenGain.gain.value = 0.05;
        siren.connect(sirenGain).connect(audio.destination);
        siren.start();
        lfo.start();

        const riser     = audio.createOscillator();
        const riserGain = audio.createGain();
        riser.type = 'sawtooth';
        riser.frequency.setValueAtTime(150, audio.currentTime);
        riser.frequency.exponentialRampToValueAtTime(1800, audio.currentTime + 20);
        riserGain.gain.value = 0.035;
        riser.connect(riserGain).connect(audio.destination);
        riser.start();

        sirenPieces = [siren, lfo, riser];
      }

      heartbeat();
    }

    /* =====================================================
       BOARD
       ===================================================== */
    function buildBoard() {
      const grid = $('grid');
      grid.innerHTML = '';
      tiles = [];

      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const button = document.createElement('button');
        button.className = 'tile';
        button.onclick = () => clickTile(i);
        grid.appendChild(button);
        tiles.push({ bomb: false, revealed: false, flagged: false, count: 0, el: button });
      }
    }

    // Indexes of the tiles touching tile i (up to 8)
    function neighbors(i) {
      const row = Math.floor(i / GRID_SIZE);
      const col = i % GRID_SIZE;
      const result = [];

      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const r = row + dy;
          const c = col + dx;
          if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
            result.push(r * GRID_SIZE + c);
          }
        }
      }
      return result;
    }

    // Bombs are placed after the first click so the first tile is always safe
    function placeBombs(safeIndex) {
      let placed = 0;
      while (placed < BOMB_COUNT) {
        const i = Math.floor(Math.random() * tiles.length);
        if (i === safeIndex || tiles[i].bomb) continue;
        tiles[i].bomb = true;
        placed++;
      }

      tiles.forEach((tile, i) => {
        tile.count = neighbors(i).filter((n) => tiles[n].bomb).length;
      });
    }

    // Open a tile. If it has 0 bombs around it, open its neighbors too.
    function revealTile(i) {
      const tile = tiles[i];
      if (tile.revealed || tile.flagged) return;

      tile.revealed = true;
      tile.el.classList.add('open');

      if (tile.count > 0) {
        tile.el.textContent = tile.count;
        tile.el.classList.add('n' + tile.count);
      } else {
        neighbors(i).forEach(revealTile);
      }
    }

    function showAllBombs() {
      tiles.forEach((tile) => {
        if (tile.bomb) {
          tile.el.textContent = '💣';
          tile.el.classList.add('bomb');
        }
      });
    }

    /* =====================================================
       GAME FLOW
       ===================================================== */
    function clickTile(i) {
      if (!gameRunning || gameOver) return;
      const tile = tiles[i];

      // Flag mode: place or remove a flag instead of opening
      if (flagMode) {
        if (!tile.revealed) {
          tile.flagged = !tile.flagged;
          tile.el.textContent = tile.flagged ? '🚩' : '';
        }
        return;
      }

      if (tile.flagged || tile.revealed) return;

      if (firstClick) {
        placeBombs(i);
        firstClick = false;
      }

      lastClick = Date.now();   // resets the 10-second countdown

      if (tile.bomb) {
        setStatus('lost 💥');
        endGame('💥 BOOM!', 'Sorry ' + playerName + ', you hit a BOMB! ahahha talo ', true);
        return;
      }

      revealTile(i);
      playTone(520, 0.08, 'triangle', 0.25);

      const allSafeOpened = tiles.every((t) => t.bomb || t.revealed);
      if (allSafeOpened) {
        setStatus('won 🏆');
        winGame();
        return;
      }

      setTension(1);   // safe click: back from panic to normal tension
    }

    function endGame(title, message, exploded) {
      gameOver = true;
      clearInterval(gameLoop);
      stopAllSounds();
      tension = 0;
      document.body.className = '';

      if (exploded) {
        showAllBombs();
        playExplosion();
      }

      // Small delay so the player sees the board before the screen appears
      setTimeout(() => {
        $('overlayTitle').textContent = title;
        $('overlayText').textContent = message;
        $('startBtn').textContent = 'Play again';
        $('overlay').style.display = 'flex';
      }, exploded ? 900 : 200);
    }

    function winGame() {
      endGame('😮‍💨 You survived!', 'All safe tiles cleared. Nerves of steel.', false);
      playTone(660, 0.3, 'triangle', 0.3);
      setTimeout(() => playTone(880, 0.4, 'triangle', 0.3), 200);
    }

    // Runs 10 times a second: updates the clock and checks the idle time
    function updateTimers() {
      const now      = Date.now();
      const timeLeft = Math.max(0, TOTAL_TIME - (now - startTime) / 1000);
      const idleTime = (now - lastClick) / 1000;

      $('timeLeft').textContent = '⏱ ' + Math.ceil(timeLeft);

      const fill = $('fill');
      fill.style.width = Math.min(100, (idleTime / IDLE_LIMIT) * 100) + '%';
      fill.style.background =
        idleTime >= IDLE_LIMIT ? '#ff2d3d' : idleTime > 6 ? '#fbbf24' : '#4ade80';

      if (idleTime >= IDLE_LIMIT) setTension(2);

      if (timeLeft <= 0) {
        setStatus('ran out of time ⏰');
        showAllBombs();
        endGame('⏰ Time\u2019s up', 'The clock hit zero. YOU LOSE.', false);
        playTone(200, 1, 'sawtooth', 0.5, 50);
      }
    }

    function startGame() {
      // A username is required before playing
      const input = $('nameInput');
      playerName = input.value.trim();
      if (!playerName) {
        input.classList.add('error');
        input.focus();
        return;
      }
      input.classList.remove('error');
      setStatus('playing 🎮');

      // Browsers only allow sound after a click, so the audio starts here
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();

      buildBoard();
      gameRunning = true;
      gameOver    = false;
      firstClick  = true;
      tension     = 0;
      startTime   = lastClick = Date.now();

      $('overlay').style.display = 'none';
      $('bombCount').textContent = '💣 ' + BOMB_COUNT;
      $('fill').style.width = '0';

      clearInterval(gameLoop);
      gameLoop = setInterval(updateTimers, 100);
    }

    /* =====================================================
       LIVE PLAYERS (only works when published as an artifact
       and the viewer is signed in; otherwise it stays hidden)
       ===================================================== */
    function setStatus(status) {
      if (room) room.presence({ name: playerName, status: status }).catch(() => {});
    }

    function showPlayers() {
      const list = $('playerList');
      list.innerHTML = '';
      const players = room.peers().filter((p) => p.presence && p.presence.name);

      players.forEach((p) => {
        const row = document.createElement('div');
        row.textContent = p.presence.name + ' — ' + p.presence.status;   // textContent keeps names safe
        list.appendChild(row);
      });
      $('players').style.display = players.length ? 'block' : 'none';
    }

    async function connectRoom() {
      try {
        if (!window.claude) return;
        room = await claude.use('room');
        if (room) room.onPeers(showPlayers);
      } catch (e) { room = null; }
    }

    /* =====================================================
       BUTTONS
       ===================================================== */
    $('startBtn').onclick = startGame;

    $('flagBtn').onclick = (event) => {
      flagMode = !flagMode;
      event.target.classList.toggle('on', flagMode);
      event.target.textContent = '🚩 Flag mode: ' + (flagMode ? 'on' : 'off');
    };

    buildBoard();   // draw an empty board behind the start screen
    connectRoom();
  </script>
</body>
</html>
